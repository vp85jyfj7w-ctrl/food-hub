<div class="mb-3">
  <label class="form-label">Name</label>
  <input type="text" class="form-control" name="name" placeholder="What this scans as" required>
</div>
<div class="mb-3">
  <label class="form-label">Brand <span class="text-muted">(optional)</span></label>
  <input type="text" class="form-control" name="brand">
</div>
<div class="row">
  <div class="col-6 mb-3">
    <label class="form-label">Category</label>
    <select class="form-select" name="category" required>
      {% for cat in ['Poultry','Meat','Seafood','Dairy','Produce','Grains','Condiments','Beverages','Snacks','Frozen','Canned','Other'] %}
      <option value="{{ cat }}">{{ cat }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-6 mb-3">
    <label class="form-label">Storage</label>
    <select class="form-select" name="storage_type" required>
      <option value="refrigerated">Refrigerated</option>
      <option value="frozen">Frozen</option>
      <option value="room_temp">Room Temp</option>
      <option value="dry">Dry Storage</option>
    </select>
  </div>
</div>
<div class="row">
  <div class="col-6 mb-3">
    <label class="form-label">Unit</label>
    <input type="text" class="form-control" name="unit" value="item">
  </div>
  <div class="col-6 mb-3">
    <label class="form-label">Shelf life (days) <span class="text-muted">(optional)</span></label>
    <input type="number" class="form-control" name="default_shelf_life_days" min="1" max="3650">
  </div>
</div>
